<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зачаруватись тобою вкотре</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f2ec;--ink:#1d1d1b;--muted:#8d877d;--line:#e3ded4;--accent:#1f4a38}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.7 'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}

.hero{position:relative;overflow:hidden;min-height:92vh;min-height:92svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:72px 24px 56px;border-bottom:1px solid var(--line)}
.dates,.num{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.hero .dates{display:flex;align-items:center;gap:14px}
.hero .dates:before,.hero .dates:after{content:'';width:36px;height:1px;background:var(--line)}
.mark{position:relative;margin:36px 0 0;line-height:.8}
.big{display:block;font:italic 500 clamp(170px,34vw,300px)/.8 'Cormorant Garamond',serif;color:var(--accent);letter-spacing:-.06em;padding-right:.08em}
.hand{position:absolute;left:58%;bottom:-.1em;font:500 clamp(38px,7vw,60px)/1 'Caveat',cursive;color:var(--ink);transform:rotate(-7deg);white-space:nowrap}
h1{font:500 clamp(28px,4vw,40px)/1.15 'Cormorant Garamond',serif}
.hero h1{margin-top:56px;max-width:520px}
.intro{margin:14px auto 0;max-width:400px;font-size:15px;color:#4a4740;white-space:pre-line}
.down{margin-top:44px;font-size:11px;letter-spacing:.2em;color:var(--muted);opacity:0;animation:appear 1s 1.4s forwards,bob 2.6s 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(7px)}}
#sky{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hero>:not(#sky){position:relative;z-index:1}
.together{margin-top:30px;font-size:11px;letter-spacing:.16em;color:var(--muted)}
.together b{font:italic 500 30px/1 'Cormorant Garamond',serif;color:var(--accent);letter-spacing:0;margin:0 6px;font-variant-numeric:tabular-nums}
.together .t{display:block;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:.24em}
.hero .dates,.hero .mark,.hero h1,.hero .intro,.hero .together{opacity:0;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.hero .mark{animation-delay:.15s}.hero h1{animation-delay:.7s}.hero .intro{animation-delay:.9s}.hero .together{animation-delay:1.1s}
.hand{opacity:0;animation:write 1.1s .9s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes appear{to{opacity:1}}
@keyframes write{from{opacity:1;clip-path:inset(-30% 100% -30% 0)}to{opacity:1;clip-path:inset(-30% 0 -30% 0)}}
.letter .w{opacity:0;filter:blur(4px);transition:opacity .6s,filter .6s}
.letter.in .w{opacity:1;filter:none}
.sign{opacity:0;transition:opacity 1s}
.letter.in .sign{opacity:1}
.burst{position:fixed;left:0;top:0;z-index:30;pointer-events:none;line-height:1;color:var(--c);font-size:var(--s);animation:fly var(--d,1s) cubic-bezier(.15,.7,.3,1) forwards}
@keyframes fly{from{transform:translate(var(--x0),var(--y0)) scale(.3);opacity:1}to{transform:translate(var(--x1),var(--y1)) scale(1) rotate(var(--rot));opacity:0}}
.page>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.page>:nth-child(2){animation-delay:.08s}.page>:nth-child(3){animation-delay:.18s}.page>:nth-child(4){animation-delay:.3s}.page>:nth-child(5){animation-delay:.42s}.page>:nth-child(6){animation-delay:.54s}
.cover .ph img{animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}
.more .ph img{transition:transform .8s}
.more .ph:hover img{transform:scale(1.06)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.hero *,.down,.hand,.sign,.letter .w{opacity:1!important;filter:none!important;clip-path:none!important}.card.pre{opacity:1;--ty:0px}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:56px 40px;padding:80px 0 100px}
.card{--r:0deg;--rx:0deg;--ry:0deg;--ty:0px;position:relative;display:block;background:var(--cb,#fff);color:var(--cf,inherit);padding:12px 12px 0;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.05);transform:perspective(900px) translateY(var(--ty)) rotate(var(--r)) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .7s cubic-bezier(.2,.7,.2,1),box-shadow .5s,opacity .9s ease;will-change:transform}
.card:hover{--ty:-8px;--r:0deg;box-shadow:0 2px 4px rgba(0,0,0,.08),0 24px 50px rgba(0,0,0,.14)}
.card.tilt{transition:transform .1s linear,box-shadow .5s}
.card.pre{opacity:0;--ty:70px}
.card:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.45),transparent 55%);opacity:0;transition:opacity .4s;pointer-events:none;mix-blend-mode:soft-light}
.card:hover:after{opacity:1}
.card .ph img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph img{transform:scale(1.06)}
.ph{background:rgba(128,120,110,.16);overflow:hidden;aspect-ratio:4/5}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 4px 18px;font:500 22px/1.15 'Caveat',cursive}
.cap span{font:500 11px 'Manrope',sans-serif;letter-spacing:.12em;color:var(--ca,var(--muted))}

.letter{max-width:560px;margin:0 auto;padding-top:64px;border-top:1px solid var(--line)}
.letter p{font:italic 500 21px/1.65 'Cormorant Garamond',serif;white-space:pre-line}
.sign{font:500 28px 'Caveat',cursive;margin-top:28px}

.lock{max-width:440px;margin:120px auto 150px;text-align:center}
.eq{display:flex;align-items:center;justify-content:center;gap:10px}
.eq .field{width:96px;padding:16px 6px;font-size:20px;letter-spacing:.04em}
.eq b{font:500 30px 'Cormorant Garamond',serif;color:var(--muted)}
.eq.shake .field{border-color:#a33}
.go{margin-top:22px;padding:14px 30px;border:0;background:var(--ink);color:var(--paper);font:500 12px 'Manrope',sans-serif;letter-spacing:.16em;cursor:pointer}
.win{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(29,29,27,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fdin .35s ease}
.win-box{width:100%;max-width:560px;background:var(--paper);padding:56px 40px 44px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.win-box .ok{display:inline-block;font:500 64px/1 'Cormorant Garamond',serif;color:var(--accent);animation:beat 1.4s ease-in-out .5s infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.win-box p{margin-top:18px;font:500 clamp(28px,5vw,38px)/1.2 'Caveat',cursive}
.win-box .go{margin-top:34px;padding:16px 34px;background:var(--accent)}
@keyframes fdin{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
.field{width:100%;padding:16px 18px;border:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);font:500 13px 'Manrope',sans-serif;letter-spacing:.2em;text-align:center;outline:none;-webkit-appearance:none}
.field::placeholder{color:var(--muted)}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.back{display:inline-block;margin-top:40px;font-size:13px;color:var(--muted)}
body{transition:background .6s ease,color .6s ease}
body.themed{background:var(--bg);color:var(--fg)}
body.themed .back,body.themed .num,body.themed .pager{color:inherit;opacity:.55}
body.themed .page h2{font-family:var(--tf);font-size:var(--ts,clamp(36px,6vw,56px));color:var(--acc)}
body.themed .verse{font-family:var(--vf);font-size:var(--vs,20px);font-style:var(--vi,italic);font-weight:var(--vw,500);border-color:var(--ln);line-height:var(--vl,1.75)}
body.themed .note{color:inherit}
body.themed .pager{border-color:var(--ln)}
body.themed .cover{background:var(--fr,#fff)}
body.l-center .verse{border:0;padding:0;text-align:center}
body.l-center .verse:before,body.l-card .verse:before{content:'✦';display:block;text-align:center;color:var(--acc);font:16px serif;margin-bottom:24px;font-style:normal}
body.l-right .verse{border-left:0;border-right:1px solid var(--ln);padding:0 22px 0 0;text-align:right}
body.l-card .verse{border:0;background:var(--card);padding:44px 36px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 14px 34px rgba(0,0,0,.07);text-align:center}
body.l-card .verse:before{margin-top:-8px}
body.l-lined .verse{border:0;padding:0 0 0 4px;background:repeating-linear-gradient(transparent 0 calc(var(--vl,1.75)*var(--vs,20px) - 1px),var(--ln) calc(var(--vl,1.75)*var(--vs,20px) - 1px) calc(var(--vl,1.75)*var(--vs,20px)))}
.page{max-width:680px;margin:0 auto;padding:48px 0 100px}
.page h2{font:500 clamp(36px,6vw,56px)/1.05 'Cormorant Garamond',serif;margin:12px 0 40px}
.cover{background:#fff;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.05)}
.cover{width:fit-content;max-width:100%;margin:0 auto;padding:10px 10px 12px;transform:rotate(-1.2deg)}
.cover .ph{aspect-ratio:auto;min-height:0;background:none}
.cover .ph img{width:auto;height:auto;max-width:100%;max-height:34vh;max-height:34svh;margin:0 auto}
.page h2{margin-bottom:28px!important}
.verse{margin-top:56px;padding-left:22px;border-left:1px solid var(--line);font:italic 500 20px/1.75 'Cormorant Garamond',serif;white-space:pre-line}
body.themed .note{font-size:17px;line-height:1.85;opacity:1;color:inherit}
body.themed .note:first-letter{float:left;font:500 3.4em/.82 var(--tf);color:var(--acc);margin:.08em .12em 0 0}
body.l-line .note{border-left:1px solid var(--ln);padding-left:22px}
body.l-right .note{border-right:1px solid var(--ln);padding-right:22px}
body.l-center .note{padding-top:34px;background:linear-gradient(var(--acc),var(--acc)) top center/48px 1px no-repeat}
body.l-card .note{background:var(--card);padding:34px 30px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 14px 34px rgba(0,0,0,.07)}
body.l-lined .note{line-height:32px;font-size:17px;background:repeating-linear-gradient(transparent 0 31px,var(--ln) 31px 32px);padding-top:2px}
/* стрічки з фото збоку */
.rail{display:none;position:fixed;top:0;bottom:0;z-index:0;width:clamp(110px,calc((100vw - 760px) / 2 - 150px),160px);border-left:1px solid var(--ln,var(--line));border-right:1px solid var(--ln,var(--line));overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
.rail.l{left:calc((100vw - 680px) / 4 - clamp(110px,calc((100vw - 760px) / 2 - 150px),160px) / 2)}
.rail.r{right:calc((100vw - 680px) / 4 - clamp(110px,calc((100vw - 760px) / 2 - 150px),160px) / 2)}
.rail .track{display:flex;flex-direction:column;gap:22px;padding:11px 14px;animation:up var(--dur,70s) linear infinite;opacity:.92;filter:blur(.4px);transition:opacity .5s,filter .5s}
.rail:hover .track{opacity:1;filter:none}
.rail.r .track{animation-direction:reverse}
.rail:hover .track,.ribbon:hover .track{animation-play-state:paused}
.rail .sp,.ribbon .sp{background:var(--fr,#fff);padding:6px 6px 18px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 20px rgba(0,0,0,.08)}
.rail .sp:nth-child(odd){transform:rotate(-2deg)}.rail .sp:nth-child(even){transform:rotate(1.6deg)}
.sp img{display:block;width:100%;height:auto}
@keyframes up{to{transform:translateY(-50%)}}
@keyframes left{to{transform:translateX(-50%)}}
.ribbon{margin:30px calc(50% - 50vw) 0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.ribbon .track{display:flex;width:max-content;gap:14px;padding:10px 0 14px;animation:left var(--dur,60s) linear infinite}
.ribbon .sp{padding:4px 4px 12px}
.ribbon .sp:nth-child(odd){transform:rotate(-2deg)}.ribbon .sp:nth-child(even){transform:rotate(2deg)}
.ribbon .sp img{width:auto;height:96px}
@media(min-width:1100px){.rail{display:block}.ribbon{display:none}.page{position:relative;z-index:1}.wrap>.back{position:relative;z-index:1;display:inline-block;margin-left:calc((100% - 680px) / 2)}}
@media(prefers-reduced-motion:reduce){.rail .track,.ribbon .track{animation:none!important}}
.gate{min-height:100vh;min-height:100svh;border:0}
.gate .lock{margin:0 auto;width:100%;max-width:360px}
.pw-label{display:block;margin-bottom:18px;font:italic 500 44px/1 'Cormorant Garamond',serif;color:var(--accent)}
.gate .pw{letter-spacing:.06em;font-size:16px;text-transform:none}
.gate .lock.shake .pw{border-color:#a33}
.gate .lock>*{opacity:0;animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards}
.gate .pw{animation-delay:.15s}.gate .go{animation-delay:.3s}
.note{margin-top:36px;color:#3a3832;white-space:pre-line}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:56px}
.more .ph{aspect-ratio:1}
.pager{display:flex;justify-content:space-between;gap:24px;margin-top:80px;padding-top:24px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

.video{aspect-ratio:16/9;background:#111;margin-top:8px}
.video iframe{width:100%;height:100%;border:0;display:block}
.page.wide{max-width:900px}

.setup{display:grid;gap:14px;margin-top:8px}
.setup button{padding:16px;border:0;background:var(--ink);color:var(--paper);font:500 13px 'Manrope',sans-serif;letter-spacing:.12em;cursor:pointer}
.setup textarea{min-height:110px;letter-spacing:0;text-align:left;font-size:12px}

.err{padding:40px 24px;font:14px/1.6 monospace;color:#a33}
.fade{animation:fd .6s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media(max-width:600px){
  .hero{padding:56px 20px 44px}
  .hand{left:54%}
  .hero h1{margin-top:44px}
  .grid{grid-template-columns:1fr 1fr;gap:28px 14px;padding:48px 0 72px}
  .card{padding:7px 7px 0}
  .cap{font-size:18px;padding:9px 2px 11px}
  .cap span{display:none}
  .letter p{font-size:19px}
  .lock{margin:90px auto 110px}
  .eq{gap:6px}
  .eq .field{width:76px;font-size:18px}
  .win-box{padding:44px 24px 34px}
}
</style>
</head>

<script>
/* показує помилку на сторінці замість білого екрана */
window.addEventListener('error', function (e) {
  document.getElementById('app').innerHTML =
    '<p class="err">Помилка в рядку ' + e.lineno + ':<br>' + e.message + '</p>';
});
</script>

  15: { name:'ми',         bg:'#f5f2ec', fr:'#fff', fg:'#1d1d1b', acc:'#1f4a38', ln:'#e3ded4', tf:`'Cormorant Garamond'`, vf:`'Cormorant Garamond'`, vs:'22px', layout:'center', fonts:[] }
};
const themeOf = (p, i) => THEMES[p.theme] || THEMES[(i % 15) + 1];
const loadedFonts = new Set();
function loadFonts(list) {
  const need = list.filter(f => !loadedFonts.has(f));
  if (!need.length) return;
  need.forEach(f => loadedFonts.add(f));
  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?' + need.map(f => 'family=' + f).join('&') + '&display=swap';
  document.head.appendChild(l);
}
function applyTheme(t) {
  const b = document.body;
  b.className = '';
  if (!t) { b.removeAttribute('style'); return; }
  loadFonts(t.fonts);
  const v = { bg:t.bg, fg:t.fg, acc:t.acc, ln:t.ln, fr:t.fr, card:t.card || '#fff', tf:t.tf + ',serif', ts:t.ts, vf:t.vf + ',serif', vs:t.vs, vi:t.vi, vw:t.vw, vl:t.vl };
  b.removeAttribute('style');
  for (const k in v) if (v[k]) b.style.setProperty('--' + k, v[k]);
  b.classList.add('themed', 'l-' + t.layout);
}

/* ============ ДАЛІ НІЧОГО МІНЯТИ НЕ ТРЕБА ============ */
const app = document.getElementById('app');
const rot = [-1.2, .8, -.5, 1.1, -.9, .6, -.3, 1];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const img = (src, alt = '') => `<div class="ph"><img data-enc="${esc(src)}" alt="${esc(alt)}"></div>`;

const strip = srcs => srcs.concat(srcs).map(src => `<div class="sp"><img data-enc="${esc(src)}" alt=""></div>`).join('');

let unlocked = null;
try { unlocked = sessionStorage.getItem('v'); } catch (e) {}

/* ============ РУХ ============ */
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;

function liven() {
  // 0 → 15
  const big = document.getElementById('big'), target = parseInt(SITE.bigNumber, 10);
  if (!calm && target > 0) {
    const t0 = performance.now() + 150;
    const step = t => {
      const k = Math.min(1, Math.max(0, (t - t0) / 1300));
      big.textContent = Math.round(target * (1 - Math.pow(1 - k, 3)));
      if (k < 1 && big.isConnected) requestAnimationFrame(step);
    };
    big.textContent = '0'; requestAnimationFrame(step);
  }
  // разом уже …
  const tog = document.getElementById('together');
  const since = new Date(SITE.since + 'T00:00:00');
  const word = n => (n % 10 === 1 && n % 100 !== 11) ? 'день' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'дні' : 'днів';
  const tick = () => {
    if (!tog.isConnected) return clearInterval(timer);
    const ms = Date.now() - since, d = Math.floor(ms / 864e5), r = ms % 864e5;
    const hh = pad(Math.floor(r / 36e5)), mm = pad(Math.floor(r / 6e4) % 60), ss = pad(Math.floor(r / 1e3) % 60);
    tog.innerHTML = `разом уже<b>${d}</b>${word(d)}<span class="t">${hh}:${mm}:${ss}</span>`;
  };
  const timer = setInterval(tick, 1000); tick();
  // фото проявляються, коли докручуєш до них
  const cards = [...document.querySelectorAll('.card')];
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const c = e.target, delay = (cards.indexOf(c) % 3) * 110;
    io.unobserve(c);
    setTimeout(() => c.classList.remove('pre'), delay);
  }), { threshold: .15 });
  cards.forEach(c => calm ? c.classList.remove('pre') : io.observe(c));
  // нахил карток за курсором
  if (fine && !calm) cards.forEach(c => {
    c.onpointermove = e => {
      const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      c.classList.add('tilt');
      c.style.setProperty('--rx', ((.5 - y) * 12).toFixed(2) + 'deg');
      c.style.setProperty('--ry', ((x - .5) * 14).toFixed(2) + 'deg');
      c.style.setProperty('--gx', (x * 100).toFixed(0) + '%');
      c.style.setProperty('--gy', (y * 100).toFixed(0) + '%');
    };
    c.onpointerleave = () => { c.classList.remove('tilt'); c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); };
  });
  // лист проявляється слово за словом
  const letter = document.getElementById('letter');
  if (letter) {
    const lo = new IntersectionObserver(es => { if (es[0].isIntersecting) { letter.classList.add('in'); lo.disconnect(); } }, { threshold: .3 });
    lo.observe(letter);
  }
  if (!calm) sky(document.getElementById('sky'), document.getElementById('hero'));
}

/* сердечка, що повільно пливуть угору в шапці */
function sky(cv, hero) {
  const ctx = cv.getContext('2d');
  const color = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#1f4a38';
  let W = 0, H = 0, mx = -999, my = -999;
  const size = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  size(); addEventListener('resize', size);
  const spawn = first => ({ x: Math.random() * W, y: first ? Math.random() * H : H + 30, s: 7 + Math.random() * 15,
    v: .18 + Math.random() * .4, ph: Math.random() * 6.3, a: .06 + Math.random() * .16, rot: (Math.random() - .5) * .6 });
  const ps = Array.from({ length: W < 600 ? 16 : 28 }, () => spawn(true));
  hero.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; });
  hero.addEventListener('pointerleave', () => { mx = my = -999; });
  const heart = (x, y, s, rot) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s / 20, s / 20);
    ctx.beginPath(); ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-10, -2, -10, -12, -4, -12); ctx.bezierCurveTo(-1, -12, 0, -9, 0, -7);
    ctx.bezierCurveTo(0, -9, 1, -12, 4, -12); ctx.bezierCurveTo(10, -12, 10, -2, 0, 6);
    ctx.fill(); ctx.restore();
  };
  const loop = () => {
    if (!cv.isConnected) return removeEventListener('resize', size);
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = color;
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      p.y -= p.v; p.ph += .012;
      const x = p.x + Math.sin(p.ph) * 16, dx = x - mx, dy = p.y - my, d = Math.hypot(dx, dy);
      if (d < 110 && d > 0) { p.x += dx / d * 2.2; p.y += dy / d * 2.2; }
      ctx.globalAlpha = p.a; heart(x, p.y, p.s, p.rot + Math.sin(p.ph) * .2);
      if (p.y < -30) ps[i] = spawn(false);
    }
    requestAnimationFrame(loop);
  };
  loop();
}

/* сердечка там, де торкнулась */
function hearts(x, y, n = 7, spread = 70, dur = 1) {
  const c = getComputedStyle(document.body).getPropertyValue('--acc').trim() || getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  for (let i = 0; i < n; i++) {
    const h = document.createElement('span'), a = Math.random() * Math.PI * 2, dist = spread * (.45 + Math.random() * .55);
    h.className = 'burst'; h.textContent = '♥';
    const st = { '--c': c, '--s': (10 + Math.random() * 14) + 'px', '--d': (dur * (.8 + Math.random() * .5)) + 's',
      '--x0': x + 'px', '--y0': y + 'px', '--x1': (x + Math.cos(a) * dist) + 'px', '--y1': (y + Math.sin(a) * dist - 40) + 'px',
      '--rot': ((Math.random() - .5) * 90) + 'deg' };
    for (const k in st) h.style.setProperty(k, st[k]);
    h.style.marginLeft = h.style.marginTop = '-.5em';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), dur * 1400);
  }
}
if (!calm) addEventListener('pointerdown', e => {
  if (e.target.closest('input,button,iframe,textarea')) return;
  hearts(e.clientX, e.clientY);
});



/* код = обидва доданки у будь-якому порядку + сума, напр. 27+554=581 */
function codeOf(a, b, c) { return Math.min(a, b) + '+' + Math.max(a, b) + '=' + c; }

function win() {
  const d = document.createElement('div');
  d.className = 'win';
  d.innerHTML = `<div class="win-box">
      <div class="ok">♡</div>
      <p>${esc(SITE.successText)}</p>
      <button class="go" id="next">${esc(SITE.successButton)}</button>
    </div>`;
  document.body.appendChild(d);
  if (!calm) {
    hearts(innerWidth / 2, innerHeight / 2, 36, Math.min(innerWidth, innerHeight) * .55, 1.6);
    setTimeout(() => hearts(innerWidth / 2, innerHeight / 2, 24, Math.min(innerWidth, innerHeight) * .4, 1.4), 350);
  }
  document.getElementById('next').onclick = () => { d.remove(); location.hash = '#/dlya-tebe'; };
}

function poem(i) {
  const p = POEMS[i];
  if (!p) return home();
  const prev = POEMS[i - 1], next = POEMS[i + 1];
  applyTheme(themeOf(p, i));
  // фото для стрічок: свої (side) або, поки їх нема, обкладинки інших віршів
  let pics = p.side && p.side.length ? p.side : POEMS.filter((q, j) => j !== i).map(q => q.cover);
  let half = Math.ceil(pics.length / 2);
  if (p.sideL && p.sideR) { pics = p.sideL.concat(p.sideR); half = p.sideL.length; }
  app.innerHTML = `
  <div class="rail l"><div class="track" style="--dur:${half * 13}s">${strip(pics.slice(0, half))}</div></div>
  <div class="rail r"><div class="track" style="--dur:${(pics.length - half) * 13}s">${strip(pics.slice(half))}</div></div>
  <div class="wrap">
    <a class="back" href="#/">← усі вірші</a>
    <article class="page fade">
      <div class="num">${pad(i + 1)} / ${pad(POEMS.length)}</div>
      <h2>${esc(p.title)}</h2>
      <div class="cover">${img(p.cover, p.title)}</div>
      <div class="ribbon"><div class="track" style="--dur:${pics.length * 6}s">${strip(pics)}</div></div>
      ${p.poem ? `<div class="verse">${esc(p.poem)}</div>` : ''}
      ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
      ${p.photos && p.photos.length ? `<div class="more">${p.photos.map(s => img(s)).join('')}</div>` : ''}
      <nav class="pager">
        ${prev ? `<a href="#/${i}">← ${esc(prev.title)}</a>` : '<span></span>'}
        ${next ? `<a href="#/${i + 2}">${esc(next.title)} →</a>` : '<a href="#/">на головну</a>'}
      </nav>
    </article>
  </div>`;
  scrollTo(0, 0);
}

function gift() {
  if (!unlocked) { location.hash = '#/'; return; }
  applyTheme(null);
  app.innerHTML = `
  <div class="wrap">

          allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>

    </section>

}

function setup() {
  applyTheme(null);
  app.innerHTML = `
  <div class="wrap">
    <section class="page fade">
      <div class="num">налаштування</div>
      <h2>Код і відео</h2>
      <form class="setup" id="sf">
        <input class="field" id="sc" placeholder="приклад: 554+27=581">
        <input class="field" id="sl" placeholder="посилання на YouTube">
        <button>Згенерувати</button>
        <textarea class="field" id="out" readonly placeholder="тут з’явиться рядок для videoCipher"></textarea>
      </form>
    </section>
  </div>`;
  document.getElementById('sf').onsubmit = async ev => {
    ev.preventDefault();
    const m = document.getElementById('sc').value.match(/(\d+)\D+(\d+)\D+(\d+)/);
    const code = m ? codeOf(+m[1], +m[2], +m[3]) : '';
    const id = ytId(document.getElementById('sl').value);
    const out = document.getElementById('out');
    if (!code || !id) { out.value = 'Перевір код і посилання.'; return; }
    out.value = await encrypt(id, code);
    out.select();
  };
}

function ytId(link) {
  const s = (link || '').trim();
  const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);
  return m ? m[1] : (/^[\w-]{11}$/.test(s) ? s : null);
}

const te = new TextEncoder(), td = new TextDecoder();
const b64 = u => btoa(String.fromCharCode(...u));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFrom(code, salt) {
  const base = await crypto.subtle.importKey('raw', te.encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encrypt(text, code) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await keyFrom(code, salt), te.encode(text)));
  return b64(new Uint8Array([...salt, ...iv, ...ct]));
}
async function decrypt(data, code) {
  const u = unb64(data);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(16, 28) }, await keyFrom(code, u.slice(0, 16)), u.slice(28));
  return td.decode(pt);
}

/* ============ ПАРОЛЬ ============ */
let KEY = null;
const norm = s => (s || '').toLowerCase().replace(/[^a-zа-яіїєґ]/g, '');
async function tryUnlock(pw) {
  const p = norm(pw);
  if (!p) return false;
  for (const lock of LOCKS) {
    try {
      const raw = unb64(await decrypt(lock, p));
      KEY = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
      const res = await fetch('d.bin', { cache: 'no-cache' });
      const data = JSON.parse(td.decode(await openBox(new Uint8Array(await res.arrayBuffer()))));
      SITE = data.SITE; POEMS = data.POEMS;
      return true;
    } catch (e) { KEY = null; }
  }
  return false;
}
const openBox = async u => new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, KEY, u.slice(12)));
const pics = new Map();
function photo(name) {
  if (!pics.has(name)) pics.set(name, fetch('p/' + name).then(r => r.arrayBuffer())
    .then(b => openBox(new Uint8Array(b))).then(u => URL.createObjectURL(new Blob([u], { type: 'image/jpeg' }))));
  return pics.get(name);
}
function hydrate() {
  document.querySelectorAll('img[data-enc]:not([src])').forEach(el => {
    el.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
    photo(el.dataset.enc).then(u => { el.src = u; }, () => { el.style.opacity = 0; });
  });
}
new MutationObserver(hydrate).observe(document.getElementById('app'), { childList: true, subtree: true });

function gate() {
  applyTheme(null);
  app.innerHTML = `
  <section class="hero gate" id="hero">
    <canvas id="sky"></canvas>
    <form class="lock" id="pwf" autocomplete="off">
      <label class="pw-label" for="pw">пароль</label>
      <input class="field pw" id="pw" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button class="go">увійти</button>
    </form>
  </section>`;
  const f = document.getElementById('pwf'), inp = document.getElementById('pw');
  inp.oninput = () => f.classList.remove('shake');
  f.onsubmit = async ev => {
    ev.preventDefault();
    inp.blur();
    if (await tryUnlock(inp.value)) { location.hash = '#/'; route(); }
    else { f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); }
  };
  if (!calm) sky(document.getElementById('sky'), document.getElementById('hero'));
}

function route() {
  if (!KEY) return gate();
  const h = location.hash.replace(/^#\/?/, '');
  if (view === 'home') homeY = scrollY;
  if (h === 'setup') { view = 'setup'; setup(); }
  else if (h === 'dlya-tebe') { view = 'gift'; gift(); }
  else if (/^\d+$/.test(h)) { view = 'poem'; poem(+h - 1); }
  else { view = 'home'; home(); }
}
addEventListener('hashchange', route);
try { localStorage.removeItem('pw'); } catch (e) {}   // пароль щоразу заново
gate();
</script>
